name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    env:
      # Empty URL is fixture mode. The suite does not need a Supabase project.
      EXPO_PUBLIC_SUPABASE_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJyb2xlIjoiYW5vbiIsInJlZiI6ImZha2UtY2ktbm90LWEtc2VjcmV0In0.ZmFrZS1zaWduYXR1cmUtbm90LWEtc2VjcmV0
          EXPO_PUBLIC_USE_FIXTURES: ""
        run: node scripts/export-web.mjs

      - name: Production bundle and dist/vercel.json
        run: node scripts/check-prod-bundle.mjs

  android-app-links:
    name: android app links manifest
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ""
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Export Android JS bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-not-a-secret
          EXPO_PUBLIC_USE_FIXTURES: ""
          EXPO_NO_DOTENV: "1"
        run: npx expo export --platform android --output-dir dist-android

      - name: service_role and seed login grep
        run: node scripts/check-js-bundle.mjs dist-android

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Intent filters and service_role grep
        run: node scripts/check-android-manifest.mjs
