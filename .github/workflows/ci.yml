name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    env:
      # Empty URL is fixture mode. The suite does not need a Supabase project.
      EXPO_PUBLIC_SUPABASE_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
